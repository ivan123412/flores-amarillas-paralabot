    <script>
        const inicio = new Date(2026, 8, 21);
        const objetivo = new Date(2026, 9, 16);

        function quitarHora(fecha) {
            return new Date(
                fecha.getFullYear(),
                fecha.getMonth(),
                fecha.getDate()
            );
        }

        function calcularDias() {
            const hoy = quitarHora(new Date());

            const diferencia = objetivo - hoy;

            const dias = Math.ceil(
                diferencia / (1000 * 60 * 60 * 24)
            );

            if (dias > 0) {
                document.getElementById("titulo").textContent =
                    `Faltan ${dias} días`;
            } else if (dias === 0) {
                document.getElementById("titulo").textContent =
                    "¡Hoy es 16 de octubre! 🌽💜";
            } else {
                document.getElementById("titulo").textContent =
                    "El 16 de octubre ya pasó 💜";
            }
        }

        function crearCalendario(mes, elementoId) {
            const contenedor = document.getElementById(elementoId);

            const primerDia = new Date(2026, mes, 1);
            const ultimoDia = new Date(2026, mes + 1, 0);

            let diaSemana = primerDia.getDay();

            if (diaSemana === 0) {
                diaSemana = 7;
            }

            for (let i = 1; i < diaSemana; i++) {
                const espacio = document.createElement("div");

                espacio.classList.add("dia", "vacio");

                contenedor.appendChild(espacio);
            }

            const hoy = quitarHora(new Date());

            for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {

                const fecha = new Date(2026, mes, dia);

                const elemento = document.createElement("div");

                elemento.classList.add("dia");

                if (mes === 9 && dia === 16) {
                    elemento.textContent = "🌽";
                } else {
                    elemento.textContent = dia;
                }

                if (fecha >= inicio && fecha < hoy) {
                    elemento.classList.add("pasado");
                }

                if (fecha.getTime() === hoy.getTime()) {
                    elemento.classList.add("hoy");
                }

                if (fecha.getTime() === objetivo.getTime()) {
                    elemento.classList.add("objetivo");
                }

                contenedor.appendChild(elemento);
            }
        }

        calcularDias();

        crearCalendario(8, "septiembre");
        crearCalendario(9, "octubre");
    </script>
